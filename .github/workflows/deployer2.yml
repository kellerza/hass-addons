on:
  workflow_call:
    inputs:
      app-stable:
        required: true
        type: string
      app-edge:
        required: true
        type: string
      publish:
        required: true
        type: boolean

name: Deploy addon to ghcr.io [new]

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      architectures: ${{ steps.info.outputs.architectures }}
      build_matrix: ${{ steps.matrix.outputs.matrix }}
      image_name: ${{ steps.normalize.outputs.image_name }}
      name: ${{ steps.normalize.outputs.name }}
      description: ${{ steps.normalize.outputs.description }}
      url: ${{ steps.normalize.outputs.url }}
      registry_prefix: ${{ steps.normalize.outputs.registry_prefix }}
      # version: ${{ steps.normalize.outputs.version }}
      version: ${{ steps.release.outputs.version }}
      environment: ${{ steps.release.outputs.environment }}
      channel_tags: ${{ steps.release.outputs.channel_tags }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Get app information
        id: info
        uses: home-assistant/actions/helpers/info@master
        with:
          path: "./${{ inputs.app-edge }}"

      - name: Normalize app information
        id: normalize
        run: |
          image=${{ steps.info.outputs.image }}
          echo "image_name=${image##*/}" >> "$GITHUB_OUTPUT"
          echo "registry_prefix=${image%/*}" >> "$GITHUB_OUTPUT"
          version=${{ steps.info.outputs.version }}
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          name=${{ steps.info.outputs.name }}
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          description=${{ steps.info.outputs.description }}
          echo "description=${description}" >> "$GITHUB_OUTPUT"
          url=${{ steps.info.outputs.url }}
          if [[ -n "$url" && "$url" != "null" ]]; then
            echo "url=${url}" >> "$GITHUB_OUTPUT"
          fi

      - name: ℹ️ Gather version and environment
        id: release
        run: |
          sha="${{ github.sha }}"

          # Default values
          environment="edge"
          version="${sha:0:7}"

          # Check if it's a release event
          if [[ "${{ github.event_name }}" == "release" ]]; then
            version="${{ github.event.release.tag_name }}"  # Lowercase the tag name
            version="${version#v}"  # Remove 'v' prefix if present

            environment="stable"

            # Set environment to beta if it's a prerelease
            if [[ "${{ github.event.release.prerelease }}" == "true" ]]; then
              environment="beta"
            fi
          fi

          # Output the environment and version
          echo "environment=${environment}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

          # Channel tags: stable also gets :latest
          {
            echo "channel_tags<<EOF"
            echo "${version}"
            echo "${environment}"
            if [[ "${environment}" == "stable" ]]; then
              echo "latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          # Log the outputs
          cat "$GITHUB_OUTPUT" >> $GITHUB_STEP_SUMMARY

      - name: Prepare build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.06.0
        with:
          architectures: ${{ steps.info.outputs.architectures }}
          image-name: ${{ steps.normalize.outputs.image_name }}
          registry-prefix: ${{ steps.normalize.outputs.registry_prefix }}


  build:
    name: 👷 Build & Deploy ${{ matrix.platform }} ${{ needs.prepare.outputs.environment }}/${{ needs.prepare.outputs.version }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.build_matrix) }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Prepare Files for Build
        run: |
          # if executable, run
          if [ -x "./build_prep.sh" ]; then
            echo "Running build_prep.sh to prepare files for the build..."
            ./build_prep.sh "${{ inputs.app-edge }}" "${{ needs.prepare.outputs.version }}"
          else
            echo "No build_prep.sh found, skipping file preparation step."
          fi

      - name: Build image
        uses: home-assistant/builder/actions/build-image@2026.06.0
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: "./${{ inputs.app-edge }}"
          image: ${{ matrix.image }}
          image-tags: ${{ needs.prepare.outputs.channel_tags }}
          labels: |
            io.hass.type=app
            io.hass.name=${{ needs.prepare.outputs.name }}
            io.hass.description=${{ needs.prepare.outputs.description }}
            ${{ needs.prepare.outputs.url && format('io.hass.url={0}', needs.prepare.outputs.url) || '' }}
          push: ${{ inputs.publish }}
          version: ${{ needs.prepare.outputs.version }}

  manifest:
    name: 🆕 Publish multi-arch manifest
    needs: [prepare, build]
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Publish multi-arch manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.06.0
        with:
          architectures: ${{ needs.prepare.outputs.architectures }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ needs.prepare.outputs.image_name }}
          image-tags: ${{ needs.prepare.outputs.channel_tags }}
          registry-prefix: ${{ needs.prepare.outputs.registry_prefix }}

  publish_addon:
    name: 🆕 Update addon version to ${{ needs.prepare.outputs.version }}
    needs: [prepare, build, manifest]
    if: inputs.publish
    # branches: [main] - restrict?
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Configure Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Update versions and commit changes
        env:
          EDGE: ${{ inputs.app-edge }}
          STABLE: ${{ inputs.app-stable }}
          VERSION: ${{ needs.prepare.outputs.version }}
          ENVIRONMENT: ${{ needs.prepare.outputs.environment }}
        run: |
          git pull --rebase origin main

          sed -i "s/version:.*/version: \"${VERSION}\"/g" "${EDGE}/config.yaml"
          git add "${EDGE}/config.yaml"

          if [[ "${ENVIRONMENT}" == "stable" ]]; then
            # Copy edge packaging onto stable. Keep stable name; slug is $STABLE.
            # Skip when they are the same add-on (local deployers).
            if [[ "${EDGE}" != "${STABLE}" ]]; then
              NAME=$(grep '^name:' "${STABLE}/config.yaml")
              [ -n "${NAME}" ]
              cp "${EDGE}/config.yaml" "${STABLE}/config.yaml"
              sed -i \
                -e "s|^name:.*|${NAME}|" \
                -e "s|^slug:.*|slug: ${STABLE}|" \
                "${STABLE}/config.yaml"
              if [[ -d "${EDGE}/translations" ]]; then
                rm -rf "${STABLE}/translations"
                cp -r "${EDGE}/translations" "${STABLE}/translations"
                git add "${STABLE}/translations"
              fi
              if [[ -f "${EDGE}/apparmor.txt" ]]; then
                cp "${EDGE}/apparmor.txt" "${STABLE}/apparmor.txt"
                git add "${STABLE}/apparmor.txt"
              fi
            fi
            sed -i "s/version:.*/version: \"${VERSION}\"/g" "${STABLE}/config.yaml"
            git add "${STABLE}/config.yaml"
          fi

          git commit -m "Update addon version to ${VERSION} [no ci]" || echo "No changes to commit"

      - name: Push changes
        run: |
          # Try to push changes
          for i in {1..3}; do
            if git push origin main; then
              echo "Successfully pushed changes"
              exit 0
            else
              echo "Push failed, attempting to rebase and retry..."
              git pull --rebase origin main
            fi
            echo "Waiting 5 seconds before next push attempt..."
            sleep 5
          done
          echo "Failed to push after 3 attempts"
          exit 1
