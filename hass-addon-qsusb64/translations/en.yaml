configuration:
  PREFIX:
    name: MQTT prefix
    description: '
      Prefix for MQTT topics (entity state, commands, and availability).

      Default: qsusb
      '

  BUTTONS:
    name: Button panels
    description: '
      One item per button panel (MQTT device triggers).

      NAME is the Home Assistant device name. MODEL is optional.

      BUTTONS is a list of QwikSwitch IDs (`@xxxxxx`). Append `:name` to set
      the trigger name, otherwise they are numbered `button_1`, `button_2`, …
      '

  LIGHTS:
    name: Lights
    description: '
      One MQTT light per QwikSwitch device.

      ID is `@xxxxxx`. KIND is `rel` (on/off relay), `dim` (brightness), or
      `imod`. NAME is the Home Assistant entity name.
      '

  SWITCHES:
    name: Switches
    description: '
      One MQTT switch per QwikSwitch device.

      ID is `@xxxxxx`. NAME is the Home Assistant entity name.
      '

  BINARY_SENSORS:
    name: Binary sensors
    description: '
      MQTT binary sensors (on/off), typically iMod pulse/switch.

      ID is `@xxxxxx`. KIND is optional. NAME is the Home Assistant entity name.

      Leave ID and NAME empty to skip a placeholder row.
      '

  SENSORS:
    name: Sensors
    description: '
      MQTT sensors that increment on each press (typically iMod pulse/switch).

      ID is `@xxxxxx`. KIND is optional. NAME is the Home Assistant entity name.

      Leave ID and NAME empty to skip a placeholder row.
      '

  IGNORE:
    name: Ignore
    description: '
      QwikSwitch IDs to ignore (no entity, no unknown-device log).

      ID is `@xxxxxx`. NAME and KIND are optional.

      Leave ID empty to skip a placeholder row.
      '

  MQTT_HOST:
    name: MQTT host
    description: MQTT broker hostname. Leave empty to use Supervisor MQTT discovery.

  MQTT_PORT:
    name: MQTT port
    description: MQTT broker port. Leave empty to use Supervisor MQTT discovery.

  MQTT_USERNAME:
    name: MQTT username
    description: MQTT broker username. Leave empty to use Supervisor MQTT discovery.

  MQTT_PASSWORD:
    name: MQTT password
    description: MQTT broker password. Leave empty to use Supervisor MQTT discovery.

  DEBUG:
    name: Debug level
    description: Log verbosity from 0 (normal) to 5 (most detail).
